[/Script/UnrealEd.EditorLoadingSavingSettings]
; Content/Slate holds raw UI files (fonts, icons) that the game reads at runtime (DCItemWidgets).
; Keep the editor's auto import away from them, otherwise it turns the .ttf files into font assets.
-AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint=,Wildcards=((Wildcard="Localization/*")))
+AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint=,Wildcards=((Wildcard="Localization/*"),(Wildcard="Slate/*")))
